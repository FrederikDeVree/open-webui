name: open-webui-dev

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui-dev
    container_name: open-webui-dev
    volumes:
      - open-webui-dev:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3002}:8080
    environment:
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui-dev:
    name: open-webui-dev
    external: true
