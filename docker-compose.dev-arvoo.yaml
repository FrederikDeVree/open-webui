name: open-webui-dev

services:
  # ── Open WebUI ───────────────────────────────────────
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui-dev
    container_name: open-webui-dev
    volumes:
      - open-webui-dev:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3002}:8080
    environment:
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}'
      - 'RAG_SYSTEM_CONTEXT=True'
      - 'DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/arvoodb'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db-network

  # ── Database ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: arvoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: arvoodb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  # ── Admin UI ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: arvoo-adminer
    restart: unless-stopped
    ports:
      - "9080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - db-network

  # ── Backup Agent ────────────────────────────────────
  backup:
    image: postgres:18
    container_name: arvoo-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - /data/backups/postgres:/backups
      - ./backup-postgres.sh:/usr/local/bin/backup-postgres.sh
    entrypoint: ["/usr/local/bin/backup-postgres.sh"]
    networks:
      - db-network

networks:
  db-network:
    driver: bridge

volumes:
  open-webui-dev:
    name: open-webui-dev
    external: true          # keep your existing named volume
  postgres-data:
    name: arvoo-postgres-data
