name: open-webui

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: arvoodb

services:
  # ── Open WebUI ───────────────────────────────────────
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}'
      - 'RAG_SYSTEM_CONTEXT=True'
      - 'DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/arvoodb'
      - 'VECTOR_DB=pgvector'
      - 'PGVECTOR_DB_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/arvoodb'
      - 'RAG_EMBEDDING_ENGINE=openai'
      - 'ENABLE_KB_EXEC=True'
      - 'ENABLE_LOGIN_FORM=False'
      - 'RAG_EMBEDDING_PREFIX_FIELD_NAME=prompt_name'
      - 'RAG_EMBEDDING_QUERY_PREFIX=web_search_query'
      - 'RAG_EMBEDDING_CONTENT_PREFIX='
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db-network

  # ── Database ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: open-webui-postgres
    restart: unless-stopped
    environment:
      <<: *postgres-env
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - open-webui-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  # ── Admin UI ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: open-webui-adminer
    restart: unless-stopped
    ports:
      - "9080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - db-network

  # ── Backup Agent ────────────────────────────────────
  backup:
    image: postgres:18
    container_name: open-webui-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - /data/backups/open-webui:/backups
      - ./backup-postgres.sh:/usr/local/bin/backup-postgres.sh
      - ./restore-postgres.sh:/usr/local/bin/restore-postgres.sh
    entrypoint: ["/usr/local/bin/backup-postgres.sh"]
    networks:
      - db-network

networks:
  db-network:
    driver: bridge

volumes:
  open-webui:
    name: open-webui
    external: true
  open-webui-data:
    name: openwebui-data
