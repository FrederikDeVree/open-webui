name: open-webui

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'WEBUI_SECRET_KEY=arvoo00'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui:
    name: open-webui
    external: true
